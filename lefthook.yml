pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,ts,cjs,mjs}"
      run: bun x oxlint --fix {staged_files}
      stage_fixed: true

    - name: oxfmt
      glob: "*.{js,ts,cjs,mjs}"
      run: bun x oxfmt {staged_files}
      stage_fixed: true

    - name: helm
      glob: "deploy/helm/**/{*.yaml,*.tpl,Chart.yaml}"
      run: helm lint ./deploy/helm

    - name: gitleaks
      run: gitleaks protect --staged --verbose

    - run: bun x tsc --noEmit
    # - run: bun x vitest run
