{{- if not .Values.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nest-api.secretName" . }}
  labels:
    {{- include "nest-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.secret.dbUrl | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  MFA_ENCRYPTION_KEYS: {{ .Values.secret.mfaEncryptionKeys | quote }}
  OTP_HMAC_KEY: {{ .Values.secret.otpHmacKey | quote }}
  {{- if .Values.secret.cookieSecret }}
  COOKIE_SECRET: {{ .Values.secret.cookieSecret | quote }}
  {{- end }}
  {{- if .Values.secret.storageS3Url }}
  STORAGE_S3_URL: {{ .Values.secret.storageS3Url | quote }}
  {{- end }}
  {{- if .Values.secret.realtimeUrl }}
  REALTIME_URL: {{ .Values.secret.realtimeUrl | quote }}
  {{- end }}
  {{- if .Values.secret.searchUrl }}
  SEARCH_URL: {{ .Values.secret.searchUrl | quote }}
  {{- end }}
  {{- if .Values.secret.mqttUrl }}
  MQTT_URL: {{ .Values.secret.mqttUrl | quote }}
  {{- end }}
  {{- if .Values.secret.mailUrl }}
  MAIL_URL: {{ .Values.secret.mailUrl | quote }}
  {{- end }}
  {{- with .Values.secret.extraData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

