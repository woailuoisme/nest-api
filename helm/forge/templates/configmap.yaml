apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nestforge.fullname" . }}-config
  labels:
    {{- include "nestforge.labels" . | nindent 4 }}
data:
  APP_ENV: "production"
  PORT: {{ .Values.app.port | quote }}
  APP_URL: {{ .Values.app.url | quote }}
  MAIL_URL: {{ .Values.mail.url | default "smtp://localhost:1025" | quote }}
  MAIL_FROM_ADDRESS: {{ .Values.mail.fromAddress | default "no-reply@nestforge.dev" | quote }}
  MAIL_FROM_NAME: {{ .Values.mail.fromName | default "NestForge" | quote }}
  THROTTLE_TTL: {{ .Values.app.throttleTtl | default "60" | quote }}
  THROTTLE_LIMIT: {{ .Values.app.throttleLimit | default "100" | quote }}
  STORAGE_DRIVER: {{ .Values.storage.driver | default "local" | quote }}
  STORAGE_LOCAL_ROOT: {{ .Values.storage.localRoot | default "./storage/uploads" | quote }}

