# ── Deployment ──────────────────────────────────────────────
replicaCount: 1

# ── Worker (BullMQ 消费者，独立进程) ───────────────────────
# 单实例：定时清理 scheduler 若多副本会重复执行
worker:
  enabled: true
  replicaCount: 1

# ── tmp 临时目录大小限制 ───────────────────────────────────
tmpSizeLimit: "64Mi"

image:
  repository: docker.cnb.cool/ailuoga/next-prisma/nestforge
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podAnnotations: {}

# ── App Config ─────────────────────────────────────────────
app:
  port: 4300
  url: "http://localhost:4300"
  throttleTtl: "60"
  throttleLimit: "100"

# ── PostgreSQL (外部服务) ───────────────────────────────────
# Chart 不部署 PG，仅引用外部实例
postgresql:
  url: "postgresql://nestforge:nestforge@postgres:5432/nestforge?schema=public"

# ── Redis (外部服务) ────────────────────────────────────────
redis:
  url: "redis://redis:6379"

# ── JWT ────────────────────────────────────────────────────
jwt:
  accessSecret: "change-me-access-secret-min-16-chars"
  accessExpiresIn: "15m"
  refreshSecret: "change-me-refresh-secret-min-16-chars"
  refreshExpiresIn: "7d"

# ── Mail (SMTP) ────────────────────────────────────────────
mail:
  url: "smtp://localhost:1025"
  fromAddress: "no-reply@nestforge.dev"
  fromName: "NestForge"

# ── OAuth (可选) ────────────────────────────────────────────
oauth:
  google:
    clientId: ""
    clientSecret: ""


# ── Storage ────────────────────────────────────────────────
storage:
  driver: local
  localRoot: "./storage/uploads"

# ── S3 (可选，仅当 storage.driver=s3) ───────────────────────
s3:
  url: ""


# ── 额外环境变量 ────────────────────────────────────────────
extraEnv: []
# - name: CUSTOM_VAR
#   value: "custom-value"

# ── Service ────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 4300

# ── Ingress ────────────────────────────────────────────────
ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: nestforge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: nestforge-tls
  #   hosts:
  #     - nestforge.local

# ── Persistence (storage/ 挂载) ────────────────────────────
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""

# ── Probes ─────────────────────────────────────────────────
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Resources ──────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── Scheduling ─────────────────────────────────────────────
nodeSelector: {}
tolerations: []
