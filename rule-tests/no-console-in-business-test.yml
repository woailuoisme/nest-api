id: no-console-in-business
valid:
  - |
    class MyService {
      doWork() {
        this.logger.log('working');
      }
    }
  - |
    class LoggerService {
      info(msg: string) {
        pinoLogger.info(msg);
      }
    }
invalid:
  - |
    function handle() {
      console.log('debug message');
    }
  - |
    class MyService {
      process() {
        console.error('error occurred');
      }
    }
