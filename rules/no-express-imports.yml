id: no-express-imports
language: typescript
message: "NestForge 采用 Fastify 适配器，严禁引入 Express 依赖或类型定义。"
severity: error
files:
  - "src/**/*.ts"
rule:
  any:
    - kind: import_statement
      has:
        kind: string_fragment
        regex: '^express(/.*)?$'
        stopBy: end
    - pattern: require('express')
    - pattern: require("express")
