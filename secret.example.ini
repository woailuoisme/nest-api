# GitHub Actions Secrets & Variables 配置模板
# 使用方法：复制此文件为 secret.ini，填入真实服务器信息后，运行 ./scripts/gh-sync-secrets.sh 即可自动同步至 GitHub 仓库

[secrets]
# 目标 VPS IP 或域名
SERVER_HOST=123.45.67.89

# 目标 VPS SSH 登录用户名
SERVER_USER=root

# 目标 VPS SSH 私钥 (OpenSSH 格式)
SERVER_SSH_KEY="-----BEGIN OPENSSH PRIVATE KEY-----
your_ssh_private_key_content_here
-----END OPENSSH PRIVATE KEY-----"

[vars]
# GitHub Repository 环境变量（可选）
# APP_ENV=production
