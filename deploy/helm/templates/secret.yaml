apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nestforge.fullname" . }}-secret
  labels:
    {{- include "nestforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.postgresql.url | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  JWT_ACCESS_SECRET: {{ .Values.jwt.accessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.jwt.refreshSecret | quote }}
  {{- with .Values.oauth.google }}
  GOOGLE_CLIENT_ID: {{ .clientId | default "" | quote }}
  GOOGLE_CLIENT_SECRET: {{ .clientSecret | default "" | quote }}
  {{- end }}
  {{- with .Values.s3 }}
  STORAGE_S3_URL: {{ .url | default "" | quote }}
  {{- end }}


