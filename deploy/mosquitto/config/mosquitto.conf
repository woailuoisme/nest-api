# Mosquitto 2.x Industrial Configuration for MQTT 5.0
# =============================================================
# 本配置即生产形态：强制账号密码接入 + 主题级 ACL，匿名连接一律拒绝。
#
# 启动前必须准备凭据（文件不入库，存放于 config/credentials/）：
#
#   cd deploy/mosquitto
#   # 1. 平台账号（须与 deploy/.env 的 MQTT_URL 中的用户名/密码一致）
#   docker run --rm -v "$PWD/config/credentials:/creds" eclipse-mosquitto:2.1-alpine \
#     mosquitto_passwd -c -b /creds/password.txt nestforge-api '<强密码>'
#   # 2. 设备账号（一机一密；-b 从参数读密码，切勿用 -c 覆盖已有账号）
#   docker run --rm -v "$PWD/config/credentials:/creds" eclipse-mosquitto:2.1-alpine \
#     mosquitto_passwd -b /creds/password.txt cnc-001 '<设备密钥>'
#   # 3. ACL 规则（按租户/设备调整）
#   cp config/acl.example config/credentials/acl.txt
#
# 凭据缺失时 Mosquitto 会启动失败（快速失败优于静默降级）；修改凭据后无需重启：
#   docker kill -s HUP mosquitto

# 1. 监听器配置 (Listeners)
# 标准 TCP 端口 (工业网关、PLC、NestJS 服务端直连)
listener 1883
protocol mqtt

# WebSocket 端口 (可选，前端 Web 仪表盘或调试工具)
listener 9001
protocol websockets

# 2. 安全策略 (Security & Auth)
# 匿名一律拒绝；账号由 password.txt 提供，授权由 acl_file 白名单管控
allow_anonymous false
password_file /mosquitto/config/credentials/password.txt
acl_file /mosquitto/config/credentials/acl.txt

# 生产建议（证书就位后启用，并同步把 deploy/.env 的 MQTT_URL 改为 mqtts:// 且放通 8883）：
#   listener 8883
#   protocol mqtt
#   cafile   /mosquitto/config/certs/ca.crt
#   certfile /mosquitto/config/certs/server.crt
#   keyfile  /mosquitto/config/certs/server.key
#   tls_version tlsv1.2

# 3. 持久化存储 (Persistence)
persistence true
persistence_location /mosquitto/data/

# 4. 工业性能调优 (Industrial Tuning)
# 最大报文尺寸：1MB (适应多点采集或批量遥测数据包)
max_packet_size 1048576
# 允许的最大心跳周期 (秒)
max_keepalive 65535
# 离线消息队列上限
max_queued_messages 10000

# 5. 日志与追踪 (Logging)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
