# 应用镜像构建与启动编排 (api + worker)
# 附属中间件 (centrifugo / meilisearch / imgproxy / mosquitto / otelcol) 由 deploy/docker-compose.yml include 本文件聚合。
# 环境变量：容器栈统一读 .env.production；根 .env 仅本地开发使用，二者勿混。
x-app: &app
  build: .
  image: nest-api:latest
  pull_policy: build
  restart: unless-stopped
  env_file:
    - .env.production
  networks:
    - backend
  # 日志留存与轮转：应用不写文件日志（仅 stdout JSON），由 Docker 日志驱动承担保留与切割；
  # max-size 10m × max-file 3 即约 30MB 上限。api 与 worker 均复用本锚点。
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *app
    container_name: nest-api
    ports:
      - "${PORT:-4300}:4300"
    # 云原生探针规范：
    # - Liveness：探测 /livez (纯文本 ok，仅检测进程与事件循环调度)
    # - Readiness：探测 /readyz (检测 DB/Redis/存储等关键依赖可用性)
    # worker 为纯应用上下文（无 HTTP），不适用 healthcheck。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4300/livez || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    <<: *app
    container_name: nestforge-worker
    # 独立队列消费进程 (entrypoint.sh worker → dist/workers/worker.main.js)
    command: ["worker"]

networks:
  backend:
    external: true
