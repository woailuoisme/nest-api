x-app: &app
  build: .
  image: nest-api:latest
  pull_policy: build
  restart: unless-stopped
  env_file:
    - .env.production
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  api:
    <<: *app
    container_name: api
    ports:
      - '4400:4400'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4400/livez || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    <<: *app
    container_name: worker
    # 独立队列消费进程 (entrypoint.sh worker → dist/cli.js worker)
    command: ['worker']

networks:
  backend:
    external: true
