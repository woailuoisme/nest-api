# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
$:
  # 手动触发：构建并推送多架构镜像 (amd64 + arm64) -> latest, latest-multi
  web_trigger:
    - services:
        - docker
      stages:
        - name: Docker build and push (multi-arch)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --tag "${REGISTRY}:latest" \
              --tag "${REGISTRY}:latest-multi" \
              --file ./Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --cache-from "type=registry,ref=${REGISTRY}:latest-multi-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:latest-multi-cache,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # 手动触发：构建并推送 amd64 单架构镜像 -> latest-amd64
  web_trigger_amd64:
    - services:
        - docker
      stages:
        - name: Docker build and push (amd64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --tag "${REGISTRY}:latest-amd64" \
              --file ./Dockerfile \
              --platform linux/amd64 \
              --cache-from "type=registry,ref=${REGISTRY}:latest-amd64-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:latest-amd64-cache,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # 手动触发：构建并推送 Helm chart
  web_trigger_helm:
    - docker:
        image: alpine/helm
      stages:
        - name: Configuring credentials
          script: helm registry login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_HELM_REGISTRY}
        - name: Build Helm packages
          script: helm package ./helm/${CNB_REPO_NAME}
        - name: Publish to CNB
          script: |
            CHART_FILE=$(ls *.tgz | head -1)
            helm push "${CHART_FILE}" oci://${CNB_HELM_REGISTRY}/${CNB_GROUP_SLUG_LOWERCASE}

  # 推送 v* 标签：构建版本化镜像
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"
            docker buildx build \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:latest" \
              --file ./Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --cache-from "type=registry,ref=${REGISTRY}:cache-alpine-multi" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-alpine-multi,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

    # 标签部署：Drizzle 数据库迁移
    - stages:
        - name: Drizzle database migration
          image: oven/bun:1-alpine
          script: |
            set -euo pipefail
            bun install --frozen-lockfile
            bun x drizzle-kit migrate
