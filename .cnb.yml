
# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
# 项目: nest-api (NestJS 12 Enterprise Backend)
# 运行时: Bun 1.4 | 入口: dist/cli.js serve | 端口: 4400
# Dockerfile 位于仓库根，基于 oven/bun Alpine 镜像构建与运行

# ── main 分支：网页手动触发（常规 push 不触发构建）──────────────────
main:
  # 网页按钮：手动构建并推送 Docker 镜像（对齐 .cnb/web_trigger.yml 中的 web_trigger_amd64）
  web_trigger_amd64: &docker_build
    - services:
        - docker
      stages:
        - name: Manual Docker build and push
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=registry,ref=${REGISTRY}:cache \
              --cache-to type=registry,ref=${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              --push .

  # 兼容默认网页触发
  web_trigger: *docker_build

# ── 正式全量发版 (v*)：镜像与 Chart 原子化联动自动发布 ───────────────
v*:
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"

            docker buildx build \
              --platform linux/amd64 \
              --cache-from type=registry,ref=${REGISTRY}:cache \
              --cache-to type=registry,ref=${REGISTRY}:cache,mode=max,image-manifest=true,oci-mediatypes=true \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              -t "${REGISTRY}:${VERSION}" \
              --build-arg GIT_COMMIT="${CNB_COMMIT:-none}" \
              --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --push .

        - name: Helm chart package & push
          docker:
            image: alpine/helm:4
          stages:
            - name: Package and push Helm chart to CNB
              script: |
                set -euo pipefail
                VERSION="${CNB_BRANCH##*/}"
                CHART_VERSION="${VERSION#v}"
                HELM_REGISTRY="${CNB_HELM_REGISTRY:-helm.cnb.cool}"
                TARGET_NAMESPACE="${CNB_GROUP_SLUG_LOWERCASE:-${CNB_REPO_SLUG_LOWERCASE}}"

                echo "${CNB_TOKEN}" | helm registry login "${HELM_REGISTRY}" -u "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin
                helm package helm/nest-api --version "${CHART_VERSION}" --app-version "${VERSION}" -d .
                helm push "nest-api-${CHART_VERSION}.tgz" "oci://${HELM_REGISTRY}/${TARGET_NAMESPACE}"

        - name: Git-Cliff & CNB Release
          docker:
            image: orhunp/git-cliff:latest
          stages:
            - name: Generate Changelog with git-cliff
              script: |
                set -eu
                git-cliff --latest --strip header -o CHANGELOG.md

            - name: Create CNB Release
              type: git:release
              options:
                tag: ${CNB_BRANCH}
                title: "Release ${CNB_BRANCH}"
                descriptionFromFile: CHANGELOG.md
                latest: true
