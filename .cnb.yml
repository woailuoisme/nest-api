# ── push main：自动构建并推送镜像 ────────────────────────────────────
main:
  push: &docker_build_amd64
    # 合并进 main 即构建并推送 amd64 镜像 -> latest, alpine
    # 单架构（linux/amd64）不经 QEMU，构建更快；如需 arm64，请走 v* 标签发布（tag_push）
    # 或 .github/workflows/build.yml 的多架构流水线（推送 GHCR / Docker Hub）。
    # alpine 为变体标签（镜像基于 oven/bun:*-alpine），与 latest 指向同一构建产物。
    - services:
        - docker
      stages:
        - name: Docker build and push (amd64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            CACHE="type=registry,ref=${REGISTRY}:cache"

            docker buildx build \
              --platform linux/amd64 \
              --cache-from "${CACHE}" \
              --cache-to "${CACHE},mode=max,image-manifest=true,oci-mediatypes=true" \
              -f Dockerfile \
              -t "${REGISTRY}:latest" \
              --push .

# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
$:
  # 手动触发：按 main 同一套标签快建一次镜像 -> latest, alpine
  web_trigger_amd64: *docker_build_amd64

  # 推送 v* 标签：构建版本化镜像（保留版本号标签供 tag_deploy.yml 固定部署）
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"
            CACHE="type=registry,ref=${REGISTRY}:cache"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from "${CACHE}" \
              --cache-to "${CACHE},mode=max,image-manifest=true,oci-mediatypes=true" \
              -f Dockerfile \
              -t "${REGISTRY}:${VERSION}" \
              -t "${REGISTRY}:latest" \
              --push .

    # 标签部署：Drizzle 数据库迁移
    - stages:
        - name: Drizzle database migration
          image: oven/bun:1-alpine
          script: |
            set -euo pipefail
            bun install --frozen-lockfile
            bun x drizzle-kit migrate
