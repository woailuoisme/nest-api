# ── 全局：标签发布 & 手动触发 ────────────────────────────────────────
$:
  # 推送标签发布：优先构建版本化多架构镜像（同时推送 :${VERSION} 与 :latest）
  tag_push: &docker_build_release
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"
            CACHE="type=registry,ref=${REGISTRY}:cache"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from "${CACHE}" \
              --cache-to "${CACHE},mode=max,image-manifest=true,oci-mediatypes=true" \
              -f Dockerfile \
              -t "${REGISTRY}:${VERSION}" \
              -t "${REGISTRY}:latest" \
              --push .

  # 手动触发：支持控制台手动触发构建
  web_trigger: *docker_build_release
