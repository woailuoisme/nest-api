# ── push main：自动构建并推送镜像 ────────────────────────────────────
main:
  push:
    # 合并进 main 即构建并推送 amd64 镜像 -> latest, latest-amd64
    # 单架构（linux/amd64）不经 QEMU，构建更快；如需 arm64，请走 v* 标签发布（tag_push）
    # 或 .github/workflows/build.yml 的多架构流水线（推送 GHCR / Docker Hub）。
    # 与手动 amd64 任务共享 latest-amd64-cache 缓存层。
    - services:
        - docker
      stages:
        - name: Docker build and push (amd64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --tag "${REGISTRY}:latest" \
              --tag "${REGISTRY}:latest-amd64" \
              --file deploy/app/Dockerfile \
              --platform linux/amd64 \
              --cache-from "type=registry,ref=${REGISTRY}:latest-amd64-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:latest-amd64-cache,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

# ── 全局：手动触发 & 标签发布 ────────────────────────────────────────
$:
  # 手动触发：构建并推送 amd64 单架构镜像 -> latest-amd64（仅单标签，便于快速验证）
  web_trigger_amd64:
    - services:
        - docker
      stages:
        - name: Docker build and push (amd64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --tag "${REGISTRY}:latest-amd64" \
              --file deploy/app/Dockerfile \
              --platform linux/amd64 \
              --cache-from "type=registry,ref=${REGISTRY}:latest-amd64-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:latest-amd64-cache,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # 手动触发：构建并推送 Helm chart
  web_trigger_helm:
    - docker:
        image: alpine/helm
      stages:
        - name: Configuring credentials
          script: helm registry login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_HELM_REGISTRY}
        - name: Build Helm packages
          script: helm package ./deploy/helm
        - name: Publish to CNB
          script: |
            CHART_FILE=$(ls *.tgz | head -1)
            helm push "${CHART_FILE}" oci://${CNB_HELM_REGISTRY}/${CNB_GROUP_SLUG_LOWERCASE}

  # 推送 v* 标签：构建版本化镜像
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release image
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"
            docker buildx build \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:latest" \
              --file deploy/app/Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --cache-from "type=registry,ref=${REGISTRY}:cache-alpine-multi" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-alpine-multi,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

    # 标签部署：Drizzle 数据库迁移
    - stages:
        - name: Drizzle database migration
          image: oven/bun:1-alpine
          script: |
            set -euo pipefail
            bun install --frozen-lockfile
            bun x drizzle-kit migrate
